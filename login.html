<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In – NexAura</title>
    <meta name="description" content="Sign in to NexAura for a personalized AI and tech news experience." />
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body id="loginPage">

    <!-- Animated Background -->
    <div class="bg-streaks" aria-hidden="true">
        <div class="bg-streak"></div>
        <div class="bg-streak"></div>
        <div class="bg-streak"></div>
        <div class="bg-streak"></div>
        <div class="bg-streak"></div>
        <div class="bg-streak"></div>
        <div class="bg-streak"></div>
        <div class="bg-streak"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <a class="nav-logo" href="index.html">
            <img src="assets/logo.png" alt="NexAura Logo" />
            <span class="nav-logo-text">NexAura</span>
        </a>

        <!-- Desktop Search -->
        <div class="nav-search">
            <span class="search-icon"></span>
            <input type="text" class="search-input" placeholder="Search AI, cybersecurity, startups…"
                autocomplete="off" />
            <div class="search-results-dropdown" id="searchDropdown"></div>
        </div>

        <!-- Desktop Nav -->
        <div class="nav-links nav-links-desktop">
            <a href="index.html" class="nav-link">Home</a>
            <a href="sources.html" class="nav-link">Sources</a>
            <a href="about.html" class="nav-link">About</a>
        </div>

        <a href="login.html" class="btn-login" id="navLoginBtn">
            <span></span> Sign In
        </a>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </nav>

    <!-- Auth Loading Overlay -->
    <div id="authLoadingOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(7,11,24,0.95);
    align-items:center;justify-content:center;backdrop-filter:blur(10px);flex-direction:column;gap:16px;">
        <div style="width:48px;height:48px;border:3px solid var(--border-glass);border-top-color:var(--accent-blue);
      border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <p style="color:var(--text-secondary);font-size:0.95rem;">Connecting...</p>
    </div>

    <!-- Auth Page -->
    <div class="auth-page relative">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="assets/logo.png" alt="NexAura" />
                <h2>NexAura</h2>
                <p>Intelligence. Delivered.</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Sign In</div>
                <div class="auth-tab" data-tab="signup">Create Account</div>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button class="social-btn google" id="googleLogin">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Continue with Google
                </button>
                <button class="social-btn linkedin" id="linkedinLogin">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#0A66C2">
                        <path
                            d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                    </svg>
                    Continue with LinkedIn
                </button>
                <button class="social-btn github" id="githubLogin">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
                        <path
                            d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z" />
                    </svg>
                    Continue with GitHub
                </button>
            </div>

            <div class="auth-divider">or continue with email</div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email address</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required />
                </div>
                <div style="text-align:right;margin-bottom:16px;">
                    <a href="#" style="font-size:0.8rem;color:var(--accent-blue);">Forgot password?</a>
                </div>
                <button type="submit" class="form-submit">Sign In to NexAura</button>
            </form>

            <!-- Sign Up Form (hidden) -->
            <form id="signupForm" style="display:none;">
                <div class="form-group">
                    <label class="form-label">Full name</label>
                    <input type="text" id="signupName" class="form-input" placeholder="Your name" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Email address</label>
                    <input type="email" id="signupEmail" class="form-input" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Create password</label>
                    <input type="password" id="signupPassword" class="form-input" placeholder="Min. 8 characters"
                        required />
                </div>
                <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:14px;">
                    By creating an account, you agree to our <a href="privacy.html"
                        style="color:var(--accent-blue);">Privacy Policy</a>.
                </p>
                <button type="submit" class="form-submit">Create Account</button>
            </form>

            <p style="text-align:center;font-size:0.8rem;color:var(--text-muted);margin-top:20px;">
                Your data is protected. <a href="privacy.html" style="color:var(--accent-blue);">Privacy Policy</a>
            </p>
        </div>
    </div>

    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

    <script src="js/main.js"></script>
    <script src="js/news.js"></script>
</body>

</html>
